[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipcap"
version = "0.1.0"
description = "CLIP + GPT-2 prefix captioning (ClipCap-style) on Flickr8k"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yani Haouchine" }]
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-tqdm",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clipcap = ["py.typed"]
