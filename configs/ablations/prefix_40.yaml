# Prefix-length ablation of configs/mlp_frozen.yaml: prefix_length = 40 instead of 10.
data:
  root: data/flickr8k
  features_dir: data/features/clip-vit-base-patch32
  max_caption_tokens: 40
  num_workers: 4

model:
  clip_name: openai/clip-vit-base-patch32
  gpt2_name: gpt2
  mapper_type: mlp
  prefix_length: 40
  freeze_gpt2: true

training:
  output_dir: outputs/ablations/prefix_40
  epochs: 20
  batch_size: 40
  learning_rate: 1.0e-4
  warmup_steps: 500
  patience: 3
  seed: 42

generation:
  strategy: beam
  beam_size: 5
  max_new_tokens: 30
