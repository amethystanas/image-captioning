# ClipCap "transformer" variant: 8-layer transformer mapper, GPT-2 frozen.
data:
  root: data/flickr8k
  features_dir: data/features/clip-vit-base-patch32
  max_caption_tokens: 40
  num_workers: 4

model:
  clip_name: openai/clip-vit-base-patch32
  gpt2_name: gpt2
  mapper_type: transformer
  prefix_length: 10
  freeze_gpt2: true
  mapper_num_layers: 8
  mapper_num_heads: 8

training:
  output_dir: outputs/transformer_frozen
  epochs: 20
  batch_size: 40
  learning_rate: 1.0e-4
  warmup_steps: 500
  patience: 3
  seed: 42

generation:
  strategy: beam
  beam_size: 5
  max_new_tokens: 30
